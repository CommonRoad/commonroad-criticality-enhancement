[project]
name = "src"
version = "0.1.4"
description = "CommonRoad Python template repository."
authors = [{name = "Cyber-Physical Systems Group, Technical University of Munich", email = "<commonroad@lists.lrz.de>"}]
readme = "README.md"
requires-python = ">=3.9"
license = "BSD-3-Clause"
dynamic = ["dependencies"]

[tool.poetry.dependencies]
python = ">=3.9, <3.12"
commonroad-io = { git = "git@gitlab.lrz.de:cps/commonroad/commonroad-io.git", branch = "develop" }
commonroad-reach = "^2025.1.0"
cvxpy = "^1.6.5"
mkdocstrings = {extras = ["python"], version = "^0.29.1"}

[tool.poetry.group.tests]
optional = true

[tool.poetry.group.tests.dependencies]
coverage = {version = "^7.1.0", extras = ["toml"] }

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
mkdocstrings-python = "^1.8.0"
mkdocs-material = "^9.5.12"

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
pip-licenses = "^4.3.4"
ruff = "^0.6.0"
mkdocs-material = "^9.6.15"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# Testing
[tool.coverage.run]
source = ["src"]

# Formatting
[tool.ruff]
line-length = 120
indent-width = 4
format.quote-style = "double"
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "I"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401"]
